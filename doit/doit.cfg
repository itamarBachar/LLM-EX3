[model]
# Choose which model to use: api, local_no_tools, or local_with_tools
provider = api

# API Provider Model Configuration
# model_name should be in the format: provider/model
# Examples:
#   - openai/gpt-4o-mini (requires OPENAI_API_KEY env var)
#   - gpt-4o-mini (shorthand for openai)
#   - anthropic/claude-3-sonnet-20240229 (requires ANTHROPIC_API_KEY)
#   - groq/mixtral-8x7b-32768 (requires GROQ_API_KEY)
api_model = gpt-4o-mini

# Local Model Configuration (without tool-calling)
# Example: mistral, neural-chat, llama2
local_model_no_tools = mistral

# Local Model Configuration (with tool-calling support)
# Example: ollama-based models with function calling
local_model_with_tools = neural-chat

# LiteLLM Configuration
# Set to true to enable debug logging
debug = false

# Max retries for API calls
max_retries = 2

# Temperature for responses (0-1)
temperature = 0.2

# Max tokens per response
max_tokens = 500