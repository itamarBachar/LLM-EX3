[model]
# Choose which model to use: api, local_no_tools, or local_with_tools
provider = api

# API Provider Model Configuration
# model_name should be in the format: provider/model or shorthand prefix
# Examples:
#   - openai/gpt-4o-mini (requires OPENAI_API_KEY env var)
#   - gpt-4o-mini (shorthand for openai)
#   - gemini/gemini-1.5-flash (requires GEMINI_API_KEY env var)
#   - gemini-1.5-flash (shorthand for gemini)
#   - anthropic/claude-3-5-sonnet-20240620 (requires ANTHROPIC_API_KEY)
#   - groq/mixtral-8x7b-32768 (requires GROQ_API_KEY)
api_model = gemini/gemini-3.1-flash-lite

# Local Model Configuration (without tool-calling)
# Examples: ollama/gemma3:4b, ollama/llama3:8b
local_model_no_tools = ollama/gemma3:4b

# Local Model Configuration (with tool-calling support)
# Examples: ollama/qwen3:4b-instruct, ollama/mistral:7b
local_model_with_tools = ollama/qwen3:4b-instruct

# LiteLLM Configuration
# Set to true to enable debug logging
debug = false

# Max retries for API calls
max_retries = 2

# Temperature for responses (0-1)
temperature = 0.2

# Max tokens per response
max_tokens = 500

[history]
# Multi-turn history: remember previous turns so follow-up instructions
# (e.g. "now sort them by date", "no, latest first") build on earlier ones.
# Set to false to disable recording and ignore prior turns.
enabled = true

# How many of the most recent turns to feed back to the model as context.
max_turns = 10

[memory]
# Persistent memory: remember facts and preferences about the user
# across different terminal windows, directories, and sessions.
enabled = true
