[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doit-cli"
version = "0.1.0"
description = "Natural language CLI command executor"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.0.0",
    "ipdb>=0.13.13",
]

[project.scripts]
doit = "doit.main:main"

[tool.hatch.build.targets.wheel]
packages = ["doit"]
